{% load i18n %}{% comment %}
  A click/tap help bubble beside a label (behavior and markup notes in
  ui-v1.js). Put it next to the <label>, never inside it, e.g.:
    <div class="label-row"><label for="sender" id="sender-label">…</label>
    {% include "stewardship/components/toggletip.html" with tip_id="sender-tip" tip_label_id="sender-label" tip_text=_("Shown as the From name.") %}</div>
  tip_id must be unique on the page; tip_label_id is optional. In a table
  heading, which holds the button itself, pass tip_label_id=tip_id so the
  button is described by its bubble alone, never by the whole cell (the
  heading, the button's own "i" and the help again). Wherever it sits, the
  bubble floats over the page beside its button (ui-v1.css, ui-v1.js), so
  opening it never moves a control or resizes or scrolls a table's box.
  With tip_zone_note=True it is the browser zone note (zone-note.html) as a
  tip, for a compact filter bar (Sent mail, #1562): tip_text is the
  sentence before the zone name, ending in a colon, and ui-v1.js
  (wireBrowserTimezone) fills the name and shows the "i" only once the
  browser reports a known zone; until then it stays hidden, as the note does.
{% endcomment %}<span class="toggletip"{% if tip_zone_note %} data-browser-zone-note hidden{% endif %}><button type="button" class="toggletip-button" aria-expanded="false" aria-controls="{{ tip_id }}" aria-label="{% translate 'More information' %}"{% if tip_label_id %} aria-describedby="{{ tip_label_id }}"{% endif %}>i</button><span class="toggletip-bubble" id="{{ tip_id }}" hidden>{{ tip_text }}{% if tip_zone_note %} <span data-browser-zone-name></span>.{% endif %}</span></span>
