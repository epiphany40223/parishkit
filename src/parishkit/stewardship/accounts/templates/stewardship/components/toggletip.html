{% load i18n %}{% comment %}
  A click/tap help bubble beside a label (behavior and markup notes in
  ui-v1.js). Put it next to the <label>, never inside it, e.g.:
    <div class="label-row"><label for="sender" id="sender-label">…</label>
    {% include "stewardship/components/toggletip.html" with tip_id="sender-tip" tip_label_id="sender-label" tip_text=_("Shown as the From name.") %}</div>
  tip_id must be unique on the page; tip_label_id is optional. In a table
  heading, which holds the button itself, pass tip_label_id=tip_id so the
  button is described by its bubble alone, never by the whole cell (the
  heading, the button's own "i" and the help again). Wherever it sits, the
  bubble floats over the page beside its button (ui-v1.css, ui-v1.js), so
  opening it never moves a control or resizes or scrolls a table's box.
  A "+N" chip (ui-conventions "Table fit and row height", #1544) passes
  tip_button_text="+2" and tip_button_more (the hidden rest of its name,
  "more share methods"), so it is named by its visible text, and
  tip_lines, a list shown one per line in the bubble instead of tip_text.
{% endcomment %}<span class="toggletip"><button type="button" class="toggletip-button{% if tip_button_text %} toggletip-chip{% endif %}" aria-expanded="false" aria-controls="{{ tip_id }}"{% if not tip_button_text %} aria-label="{% translate 'More information' %}"{% endif %}{% if tip_label_id %} aria-describedby="{{ tip_label_id }}"{% endif %}>{% if tip_button_text %}{{ tip_button_text }}<span class="visually-hidden"> {{ tip_button_more }}</span>{% else %}i{% endif %}</button><span class="toggletip-bubble" id="{{ tip_id }}" hidden>{% if tip_lines %}{% for line in tip_lines %}<span class="toggletip-line">{{ line }}</span>{% endfor %}{% else %}{{ tip_text }}{% endif %}</span></span>
