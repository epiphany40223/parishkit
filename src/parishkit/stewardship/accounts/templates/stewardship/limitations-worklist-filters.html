{% load i18n %}{% comment %}
  Limitations' own filters after the worklist's Stage (#1685), inside the
  shared filters form (components/review-worklist.html): a name or Family
  DUID search and the Show choice.
{% endcomment %}{% with q=query.limitations %}<div><label for="limitations-search">{% translate "Search name or Family DUID" %}</label><input id="limitations-search" name="search" maxlength="200" value="{{ q.search }}"></div>
<div class="wide"><label for="limitations-filter">{% translate "Show" %}</label><select id="limitations-filter" name="show"><option value="any">{% translate "Everything" %}</option><option value="cannot_serve"{% if q.show == 'cannot_serve' %} selected{% endif %}>{% translate "Cannot participate in Ministries" %}</option><option value="cannot_attend"{% if q.show == 'cannot_attend' %} selected{% endif %}>{% translate "Families that cannot attend Mass" %}</option></select></div>{% endwith %}
