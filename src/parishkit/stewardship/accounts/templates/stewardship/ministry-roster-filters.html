{% load i18n %}{% comment %}Roster changes to enter's own filter after Stage on the review worklist (#1687): the Ministry to enter, one of the Ministries the list reads, as a closed DUID value.{% endcomment %}<div><label for="roster-ministry">{% translate "Ministry" %}</label><select id="roster-ministry" name="ministry"><option value="">{% translate "All Ministries" %}</option>{% for item in ministries %}<option value="{{ item.duid }}"{% if ministry == item.duid|stringformat:'s' %} selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></div>
