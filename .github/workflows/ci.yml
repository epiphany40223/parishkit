name: CI

# Run the same validation on pull requests, on merge-queue groups, and on
# pushes to main. The merge_group trigger is required for the merge queue:
# without it no checks run on the temporary queue branches, so the queue
# cannot fail a queued pull request.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements/stewardship-build.txt
          python -m pip install --no-build-isolation -r requirements.txt

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Markdown lint
        run: python -m pymarkdown --config .pymarkdown.json scan $(git ls-files '*.md')

      - name: Credential-free baseline
        run: python -m pytest

      - name: Migration drift
        env:
          DJANGO_SETTINGS_MODULE: parishkit.stewardship.settings.test
        run: python -m django makemigrations --check --dry-run

  stewardship-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements/stewardship-build.txt
          python -m pip install --no-build-isolation -r requirements.txt

      - name: Build development application image
        run: docker compose -f deploy/stewardship/compose.yaml -f deploy/stewardship/compose.development.yaml build web

      - name: Validate topology, in-image tests, reload, and persistence
        env:
          PARISHKIT_RUN_COMPOSE_TESTS: "1"
          PARISHKIT_RUN_COMPOSE_SMOKE: "1"
        run: python -m pytest tests/stewardship/test_compose.py -q -s

  stewardship-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/stewardship/browser/package-lock.json
      - name: Install component test dependencies
        run: |
          python -m pip install -r requirements/stewardship-build.txt
          python -m pip install --no-build-isolation -r requirements.txt -r requirements/stewardship-browser.txt
          npm ci --ignore-scripts --prefix tests/stewardship/browser
          python -m playwright install --with-deps chromium firefox webkit
      - name: Responsive, keyboard, accessibility, and session component checks
        env:
          PARISHKIT_RUN_BROWSER_TESTS: "1"
        run: python -m pytest tests/stewardship/browser -q

  stewardship-postgresql:
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:9.1.2@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
        ports: ["56379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
      postgres:
        image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: stewardship_tests
          POSTGRES_DB: stewardship_tests
          POSTGRES_PASSWORD: disposable-test-only
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U stewardship_tests"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DJANGO_SETTINGS_MODULE: parishkit.stewardship.settings.database_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements/stewardship-build.txt
          python -m pip install --no-build-isolation -r requirements.txt
      - name: Scoped line and branch coverage
        run: python -m parishkit.stewardship.quality --postgresql --report "$RUNNER_TEMP/stewardship-coverage.json"
