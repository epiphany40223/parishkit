name: CI

# Drafts get fast feedback; ready PR candidates get the full suite. Pushes to
# main run only the light validate job (temporary, to stay within the free
# plan's 20 concurrent jobs; see issue #158). A manual dispatch runs the
# full suite on any ref, and releases require that full run on the tagged
# commit. Never let skipped draft jobs satisfy the always-running aggregate
# merge gates.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR heads cannot satisfy the final-head gate, and an older main
# push is superseded by a newer one, so stop spending runner time on them.
# Manual full runs (release evidence) keep unique, uncancelled groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements/stewardship-build.txt
          python -m pip install --no-build-isolation -r requirements.txt

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Markdown lint
        run: python -m pymarkdown --config .pymarkdown.json scan $(git ls-files '*.md')

      # Catch packaging/registry/workflow failures before allocating 20 runners.
      # This is deliberately a small smoke subset, never complete-suite evidence.
      - name: Fast application and CI contracts
        run: >-
          python -m pytest
          tests/stewardship/test_build.py
          tests/stewardship/test_runtime_grants.py
          tests/stewardship/test_quality_ci.py
          tests/stewardship/test_browser_ci.py
          tests/stewardship/test_database_gate.py
          tests/stewardship/test_security_delivery.py
          tests/stewardship/test_financial_documents.py
          tests/stewardship/test_financial_report.py
          tests/stewardship/test_log_rows.py
          tests/stewardship/test_smoke.py
          --require-no-skips -q

      - name: Migration drift
        env:
          DJANGO_SETTINGS_MODULE: parishkit.stewardship.settings.test
        run: python -m django makemigrations --check --dry-run

  stewardship-compose-core:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements/stewardship-build.txt
          python -m pip install --no-build-isolation -r requirements.txt

      - name: Build development application image
        run: docker compose -f deploy/stewardship/compose.yaml -f deploy/stewardship/compose.development.yaml build web

      - name: Verify real service mount isolation
        env:
          PARISHKIT_RUN_ISOLATION_TESTS: "1"
        run: python -m pytest tests/stewardship/test_container_isolation.py --require-no-skips -q

      - name: Validate topology, in-image tests, reload, and persistence
        env:
          PARISHKIT_RUN_COMPOSE_TESTS: "1"
          PARISHKIT_RUN_COMPOSE_SMOKE: "1"
        run: python -m pytest tests/stewardship/test_compose.py -q -s

      - name: Validate operational runtime and provisioning
        env:
          PARISHKIT_RUN_RUNTIME_TESTS: "1"
        run: python -m pytest tests/stewardship/test_database_provisioning_container.py tests/stewardship/test_runtime_provisioning_container.py tests/stewardship/test_runtime_ingress_container.py tests/stewardship/test_broker_valkey_container.py --require-no-skips --durations=10 -q

  stewardship-operational:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        provider: [configured, initial, complete, abort]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements/stewardship-build.txt
          python -m pip install --no-build-isolation -r requirements.txt
      - name: Build development application image
        run: docker build -f deploy/stewardship/Dockerfile -t parishkit-stewardship:development .
      - name: Validate isolated development and production scenarios
        env:
          PARISHKIT_RUN_RUNTIME_TESTS: "1"
          PROVIDER_MODE: ${{ matrix.provider }}
        # Reuse installation/image bootstrap, never mutable runtime state.
        # Each test owns a fresh UUID Compose project, credentials and volume.
        run: >-
          python -m pytest
          "tests/stewardship/test_operational_compose.py::test_complete_foundation_bootstrap_and_online_exclusion[$PROVIDER_MODE-False]"
          "tests/stewardship/test_operational_compose.py::test_complete_foundation_bootstrap_and_online_exclusion[$PROVIDER_MODE-True]"
          --require-no-skips --ci-progress --durations=10 -q

  # Preserve the branch-protection check name, and fail on cancellation too.
  stewardship-compose:
    needs: [stewardship-compose-core, stewardship-operational]
    if: ${{ always() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all container scenarios
        env:
          CORE_RESULT: ${{ needs.stewardship-compose-core.result }}
          OPERATIONAL_RESULT: ${{ needs.stewardship-operational.result }}
        run: |
          echo 'Full validation requires a ready PR, successful preflight, and all container scenarios.'
          test "$CORE_RESULT" = success
          test "$OPERATIONAL_RESULT" = success

  stewardship-browser-engine:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      BROWSER_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/stewardship/browser/package-lock.json
      - name: Install component test dependencies
        run: |
          python -m pip install -r requirements/stewardship-build.txt
          python -m pip install --no-build-isolation -r requirements.txt -r requirements/stewardship-browser.txt
          npm ci --ignore-scripts --prefix tests/stewardship/browser
          python -m playwright install --with-deps "$BROWSER_ENGINE"
      - name: Responsive, keyboard, accessibility, and session component checks
        env:
          PARISHKIT_RUN_BROWSER_TESTS: "1"
        run: python -m parishkit.stewardship.quality_browser --engine "$BROWSER_ENGINE"

  # Preserve the protected check name, including failed/cancelled matrix work.
  stewardship-browser:
    needs: stewardship-browser-engine
    if: ${{ always() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every browser engine
        env:
          BROWSER_RESULT: ${{ needs.stewardship-browser-engine.result }}
        run: |
          echo 'Full validation requires a ready PR, successful preflight, and every browser engine.'
          test "$BROWSER_RESULT" = success

  # The 12 coverage partitions run three per job. The tests mostly wait on
  # PostgreSQL, so three partitions share a runner well, and each gets its own
  # PostgreSQL/Valkey pair because SQL roles are cluster-wide fixtures. Four
  # jobs replace twelve: less per-job setup and fewer of the free plan's 20
  # concurrent job slots per PR (see #158).
  stewardship-postgresql-shard:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { first: 1, second: 2, third: 3 }
          - { first: 4, second: 5, third: 6 }
          - { first: 7, second: 8, third: 9 }
          - { first: 10, second: 11, third: 12 }
    services:
      valkey-1:
        image: valkey/valkey:9.1.2@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
        ports: ["56379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
      postgres-1:
        image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: stewardship_tests
          POSTGRES_DB: stewardship_tests
          POSTGRES_PASSWORD: disposable-test-only
          # Keep errors/details, not multi-megabyte rejected payload statements.
          POSTGRES_INITDB_ARGS: --set=log_min_error_statement=panic
        ports: ["55432:5432"]
        options: >-
          --tmpfs /var/lib/postgresql:rw,size=2g
          --health-cmd "pg_isready -U stewardship_tests"
          --health-interval 2s --health-timeout 5s --health-retries 30
      valkey-2:
        image: valkey/valkey:9.1.2@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
        ports: ["56380:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
      postgres-2:
        image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: stewardship_tests
          POSTGRES_DB: stewardship_tests
          POSTGRES_PASSWORD: disposable-test-only
          # Keep errors/details, not multi-megabyte rejected payload statements.
          POSTGRES_INITDB_ARGS: --set=log_min_error_statement=panic
        ports: ["55433:5432"]
        options: >-
          --tmpfs /var/lib/postgresql:rw,size=2g
          --health-cmd "pg_isready -U stewardship_tests"
          --health-interval 2s --health-timeout 5s --health-retries 30
      valkey-3:
        image: valkey/valkey:9.1.2@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
        ports: ["56381:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
      postgres-3:
        image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: stewardship_tests
          POSTGRES_DB: stewardship_tests
          POSTGRES_PASSWORD: disposable-test-only
          # Keep errors/details, not multi-megabyte rejected payload statements.
          POSTGRES_INITDB_ARGS: --set=log_min_error_statement=panic
        ports: ["55434:5432"]
        options: >-
          --tmpfs /var/lib/postgresql:rw,size=2g
          --health-cmd "pg_isready -U stewardship_tests"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DJANGO_SETTINGS_MODULE: parishkit.stewardship.settings.database_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements/stewardship-build.txt
          python -m pip install --no-build-isolation -r requirements.txt
      - name: Measure isolated database partitions
        env:
          PARTITIONS: ${{ matrix.first }} ${{ matrix.second }} ${{ matrix.third }}
        run: |
          # Slot N uses the Nth PostgreSQL/Valkey pair; logs are replayed in
          # order after all three finish so interleaved output stays readable.
          slot=0
          pids=()
          for index in $PARTITIONS; do
            PARISHKIT_TEST_POSTGRES_PORT=$((55432 + slot)) \
            PARISHKIT_TEST_VALKEY_PORT=$((56379 + slot)) \
              python -m parishkit.stewardship.quality_ci shard --index "$index" --count 12 --output "$RUNNER_TEMP/stewardship-shard-$index" \
              > "$RUNNER_TEMP/partition-$index.log" 2>&1 &
            pids+=("$!")
            slot=$((slot + 1))
          done
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          for index in $PARTITIONS; do
            echo "::group::Partition $index"
            cat "$RUNNER_TEMP/partition-$index.log"
            echo "::endgroup::"
          done
          exit "$status"
      - name: Retain partition {{ matrix.first }} evidence
        uses: actions/upload-artifact@v4
        with:
          name: stewardship-coverage-${{ matrix.first }}
          path: ${{ runner.temp }}/stewardship-shard-${{ matrix.first }}/
          if-no-files-found: error
          retention-days: 7
      - name: Retain partition {{ matrix.second }} evidence
        uses: actions/upload-artifact@v4
        with:
          name: stewardship-coverage-${{ matrix.second }}
          path: ${{ runner.temp }}/stewardship-shard-${{ matrix.second }}/
          if-no-files-found: error
          retention-days: 7
      - name: Retain partition {{ matrix.third }} evidence
        uses: actions/upload-artifact@v4
        with:
          name: stewardship-coverage-${{ matrix.third }}
          path: ${{ runner.temp }}/stewardship-shard-${{ matrix.third }}/
          if-no-files-found: error
          retention-days: 7

  # Preserve the required check name. Missing/failed/cancelled shards must make
  # this gate fail, rather than skipping it and accidentally permitting merge.
  stewardship-postgresql:
    needs: stewardship-postgresql-shard
    if: ${{ always() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require all database shards
        env:
          SHARD_RESULT: ${{ needs.stewardship-postgresql-shard.result }}
        run: |
          echo 'Full validation requires a ready PR, successful preflight, and all database shards.'
          test "$SHARD_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements/stewardship-build.txt
          python -m pip install --no-build-isolation -r requirements.txt
      - name: Download this run's coverage evidence
        uses: actions/download-artifact@v5
        with:
          pattern: stewardship-coverage-*
          path: ${{ runner.temp }}/stewardship-shards
      - name: Scoped line and branch coverage
        run: python -m parishkit.stewardship.quality_ci combine --count 12 --input "$RUNNER_TEMP/stewardship-shards" --report "$RUNNER_TEMP/stewardship-coverage.json"
      - name: Retain combined coverage
        uses: actions/upload-artifact@v4
        with:
          name: stewardship-coverage-combined
          path: ${{ runner.temp }}/stewardship-coverage.json
          if-no-files-found: error
          retention-days: 7
