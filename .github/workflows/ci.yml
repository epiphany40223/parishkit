name: CI

# Drafts get fast feedback. A full run comes from opened, synchronize or
# reopened on a non-draft PR, or from a manual dispatch; marking a draft ready
# starts no run (#624: delivery marks a PR ready seconds before it is merged).
# A push to main runs only main-tree-evidence (#158): main may rest only on a
# tree that a successful full run already tested, normally a release train's
# run, so the push is checked rather than retested, and a full run is
# dispatched only when no run covers the tree. A manual dispatch runs the full
# suite on any ref by default, and releases require that full run on the
# tagged tree, apart from docs (#662). Ready PRs, and dispatches that
# explicitly ask for "affected" jobs, skip the heavy job groups their changed
# paths cannot affect (parishkit.stewardship.quality_paths, issue #626); the
# aggregate gates accept only that intentional skip, never a draft, failed,
# cancelled or unexpected skip.

# A dispatch names its job selection. release.yml and release.sh accept only
# a run named exactly "CI (jobs: all)" as release evidence, so keep this
# format in step with them. Other runs keep GitHub's default name (a run-name
# that is empty falls back to it).
run-name: "${{ github.event_name == 'workflow_dispatch' && format('CI (jobs: {0})', inputs.jobs) || '' }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # "all" stays the default so release and merge evidence is complete
      # unless someone explicitly asks for less. An "affected" dispatch of a
      # commit that is already on main when it runs has an empty diff and runs
      # everything; the release checks refuse "affected" runs regardless.
      jobs:
        description: Run all jobs, or only those the branch's changes can affect
        type: choice
        options: [all, affected]
        default: all

permissions:
  contents: read

# Superseded PR heads cannot satisfy the final-head gate, and an older main
# push is superseded by a newer one, so stop spending runner time on them:
# only the last push of a train's merge burst checks main's tree. Manual full
# runs (release evidence, and a backfill main-tree-evidence dispatches) keep
# unique, uncancelled groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # A push to main never retests here; main-tree-evidence checks it instead.
  validate:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    # The complete non-database suite adds a few minutes when shards are
    # skipped, and an affected dispatch's database test selection up to 10.
    timeout-minutes: 35
    # actions: read lets an "affected" dispatch fetch the newest test map.
    permissions:
      contents: read
      actions: read
    outputs:
      postgresql: ${{ steps.paths.outputs.postgresql }}
      # "subset" only on an "affected" dispatch with a usable test map;
      # empty or "all" runs every database test (quality_select, #858).
      database_selection: ${{ steps.select.outputs.database_selection }}
      browser: ${{ steps.paths.outputs.browser }}
      compose: ${{ steps.paths.outputs.compose }}
      operational: ${{ steps.paths.outputs.operational }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The pull request test merge commit and its base-branch parent.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          tools/ci-pip-install.sh -r requirements/stewardship-build.txt
          tools/ci-pip-install.sh --no-build-isolation -r requirements.txt

      # An "affected" dispatch diffs the branch against its merge base with
      # main, which the two-commit checkout lacks. If this fetch fails, the
      # classifier cannot find the merge base and runs every job.
      - name: Fetch main for an affected-jobs dispatch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.jobs == 'affected' }}
        continue-on-error: true
        timeout-minutes: 5
        run: git fetch --no-tags --unshallow origin +refs/heads/main:refs/remotes/origin/main

      - name: Classify changed paths
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          JOBS: ${{ inputs.jobs }}
        run: python -m parishkit.stewardship.quality_paths --event "$EVENT" --jobs "$JOBS" --output "$GITHUB_OUTPUT"

      # An "affected" dispatch narrows the database group to the tests the
      # newest full run's coverage map ties to the changed files. Any doubt,
      # including this step failing, leaves the output empty, which runs the
      # whole group.
      - name: Select database tests for an affected-jobs dispatch
        id: select
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.jobs == 'affected' && steps.paths.outputs.postgresql == 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -m parishkit.stewardship.quality_select --count 16 --map-directory "$RUNNER_TEMP/test-maps" --selection "$RUNNER_TEMP/database-selection.json" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      - name: Retain the database test selection
        if: ${{ steps.select.outputs.database_selection == 'subset' }}
        uses: actions/upload-artifact@v4
        with:
          name: stewardship-database-selection
          path: ${{ runner.temp }}/database-selection.json
          if-no-files-found: error
          retention-days: 7

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Markdown lint
        run: python -m pymarkdown --config .pymarkdown.json scan $(git ls-files '*.md')

      # Catch packaging/registry/workflow failures before allocating the heavy
      # runners. This is deliberately a small smoke subset, never
      # complete-suite evidence.
      - name: Fast application and CI contracts
        run: >-
          python -m pytest
          tests/stewardship/test_build.py
          tests/stewardship/test_runtime_grants.py
          tests/stewardship/test_quality_ci.py
          tests/stewardship/test_browser_ci.py
          tests/stewardship/test_database_gate.py
          tests/stewardship/test_security_delivery.py
          tests/stewardship/test_financial_documents.py
          tests/stewardship/test_financial_report.py
          tests/stewardship/test_log_rows.py
          tests/stewardship/test_smoke.py
          tests/stewardship/test_quality_paths.py
          tests/stewardship/test_quality_select.py
          --require-no-skips -q

      # Shard one normally runs the complete non-database suite, which includes
      # the contract tests that read docs, workflows and deployment files.
      - name: Complete non-database suite
        if: ${{ steps.paths.outputs.postgresql == 'false' }}
        run: python -m pytest tests --ds=parishkit.stewardship.settings.test -p no:cacheprovider -q

      - name: Migration drift
        env:
          DJANGO_SETTINGS_MODULE: parishkit.stewardship.settings.test
        run: python -m django makemigrations --check --dry-run

  stewardship-compose-core:
    needs: validate
    if: ${{ needs.validate.outputs.compose != 'false' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) }}
    runs-on: ubuntu-latest
    # About 14-17 minutes in October 2026; leave room for the in-image
    # baseline's own 15-minute limit in test_compose.py (#1278).
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          tools/ci-pip-install.sh -r requirements/stewardship-build.txt
          tools/ci-pip-install.sh --no-build-isolation -r requirements.txt

      - name: Pull Docker Hub images through a mirror
        # Anonymous Docker Hub pulls hit its rate limit (#892).
        run: tools/ci-docker-mirror.sh

      - name: Build development application image
        run: docker compose -f deploy/stewardship/compose.yaml -f deploy/stewardship/compose.development.yaml build web

      - name: Verify real service mount isolation
        env:
          PARISHKIT_RUN_ISOLATION_TESTS: "1"
        run: python -m pytest tests/stewardship/test_container_isolation.py --require-no-skips -q

      - name: Validate topology, in-image tests, reload, and persistence
        env:
          PARISHKIT_RUN_COMPOSE_TESTS: "1"
          PARISHKIT_RUN_COMPOSE_SMOKE: "1"
        run: python -m pytest tests/stewardship/test_compose.py -q -s

      - name: Validate operational runtime and provisioning
        env:
          PARISHKIT_RUN_RUNTIME_TESTS: "1"
        run: python -m pytest tests/stewardship/test_database_provisioning_container.py tests/stewardship/test_runtime_provisioning_container.py tests/stewardship/test_runtime_ingress_container.py tests/stewardship/test_broker_valkey_container.py --require-no-skips --durations=10 -q

  stewardship-operational:
    needs: validate
    if: ${{ needs.validate.outputs.operational != 'false' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) }}
    runs-on: ubuntu-latest
    # One runner for all four provider modes (#627): about 18 minutes, still
    # under the PostgreSQL and browser jobs, and one fewer runner slot, so
    # two overlapping full runs fit within the 20-job plan limit.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          tools/ci-pip-install.sh -r requirements/stewardship-build.txt
          tools/ci-pip-install.sh --no-build-isolation -r requirements.txt
      - name: Pull Docker Hub images through a mirror
        # Anonymous Docker Hub pulls hit its rate limit (#892).
        run: tools/ci-docker-mirror.sh
      - name: Build development application image
        run: docker build -f deploy/stewardship/Dockerfile -t parishkit-stewardship:development .
      - name: Validate isolated development and production scenarios
        env:
          PARISHKIT_RUN_RUNTIME_TESTS: "1"
          PROVIDER_MODES: configured initial complete abort
        # Reuse installation/image bootstrap, never mutable runtime state.
        # Each test owns a fresh UUID Compose project, credentials and volume.
        run: |
          cases=()
          for mode in $PROVIDER_MODES; do
            for production in False True; do
              cases+=("tests/stewardship/test_operational_compose.py::test_complete_foundation_bootstrap_and_online_exclusion[$mode-$production]")
            done
          done
          python -m pytest "${cases[@]}" --require-no-skips --ci-progress --durations=10 -q

  # Preserve the branch-protection check name, and fail on cancellation too.
  stewardship-compose:
    needs: [validate, stewardship-compose-core, stewardship-operational]
    if: ${{ always() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all container scenarios
        env:
          CORE_RESULT: ${{ needs.stewardship-compose-core.result }}
          OPERATIONAL_RESULT: ${{ needs.stewardship-operational.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          CORE_RUN: ${{ needs.validate.outputs.compose }}
          OPERATIONAL_RUN: ${{ needs.validate.outputs.operational }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          JOBS: ${{ inputs.jobs }}
        run: |
          echo 'Full validation requires successful preflight and all container scenarios.'
          # A ready PR, or a dispatch that asked for affected jobs only, may
          # skip a job its changed paths cannot affect; nothing else may.
          allowed=false
          if test "$VALIDATE_RESULT" = success &&
            { { test "$EVENT" = pull_request && test "$DRAFT" = false; } ||
              { test "$EVENT" = workflow_dispatch && test "$JOBS" = affected; }; }; then
            allowed=true
          fi
          # Each job is judged by its own group: a template-only change runs
          # compose-core but skips the operational scenarios.
          if test "$allowed" = true && test "$CORE_RUN" = false &&
            test "$CORE_RESULT" = skipped; then
            echo 'No changed path can affect compose-core; skipped intentionally.'
            CORE_RESULT=success
          fi
          if test "$allowed" = true && test "$OPERATIONAL_RUN" = false &&
            test "$OPERATIONAL_RESULT" = skipped; then
            echo 'No changed path can affect the operational scenarios; skipped intentionally.'
            OPERATIONAL_RESULT=success
          fi
          test "$CORE_RESULT" = success
          test "$OPERATIONAL_RESULT" = success

  stewardship-browser-engine:
    needs: validate
    if: ${{ needs.validate.outputs.browser != 'false' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) }}
    runs-on: ubuntu-latest
    # On 2026-09-30 a slow Ubuntu package mirror spent 17 minutes installing
    # WebKit's system packages, so 25 minutes cancelled passing runs.
    # quality_browser.py bounds the test run itself at 50 minutes, split into
    # one budget per partition (#1112), leaving 10 minutes for setup and
    # post-job steps.
    timeout-minutes: 60
    # One job per quality_sharding.BROWSER_JOBS entry (#627): Firefox halved
    # by test file, one half per job, each near 40% of the test budget
    # (#1380), and WebKit (the slowest engine) and Chromium each split in
    # three, one third of each per job, each near 60% (#1151). WebKit runs
    # last so it inherits Chromium's unused budget (#1112). Each job installs
    # only its engines and must prove every partition ran all of its cases.
    strategy:
      fail-fast: false
      matrix:
        runs:
          - "firefox:1/2"
          - "firefox:2/2"
          - "chromium:1/3 webkit:1/3"
          - "chromium:2/3 webkit:2/3"
          - "chromium:3/3 webkit:3/3"
    env:
      BROWSER_RUNS: ${{ matrix.runs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/stewardship/browser/package-lock.json
      - name: Install component test dependencies
        run: |
          tools/ci-pip-install.sh -r requirements/stewardship-build.txt
          tools/ci-pip-install.sh --no-build-isolation -r requirements.txt -r requirements/stewardship-browser.txt
          npm ci --ignore-scripts --prefix tests/stewardship/browser
          read -ra runs <<<"$BROWSER_RUNS"
          python -m playwright install --with-deps "${runs[@]%%:*}"
      - name: Responsive, keyboard, accessibility, and session component checks
        env:
          PARISHKIT_RUN_BROWSER_TESTS: "1"
        run: python -m parishkit.stewardship.quality_browser --runs "$BROWSER_RUNS"

  # Preserve the protected check name, including failed/cancelled matrix work.
  stewardship-browser:
    needs: [validate, stewardship-browser-engine]
    if: ${{ always() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every browser engine
        env:
          BROWSER_RESULT: ${{ needs.stewardship-browser-engine.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PATH_RUN: ${{ needs.validate.outputs.browser }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          JOBS: ${{ inputs.jobs }}
        run: |
          echo 'Full validation requires successful preflight and every browser engine.'
          # A ready PR, or a dispatch that asked for affected jobs only, may
          # skip a job its changed paths cannot affect; nothing else may.
          allowed=false
          if test "$VALIDATE_RESULT" = success &&
            { { test "$EVENT" = pull_request && test "$DRAFT" = false; } ||
              { test "$EVENT" = workflow_dispatch && test "$JOBS" = affected; }; }; then
            allowed=true
          fi
          if test "$allowed" = true && test "$PATH_RUN" = false &&
            test "$BROWSER_RESULT" = skipped; then
            echo 'No changed path can affect these checks; skipped intentionally.'
            echo 'intentional=true' >> "${GITHUB_OUTPUT:-/dev/null}"
            exit 0
          fi
          test "$BROWSER_RESULT" = success

  # Each job runs PARTITIONS_PER_JOB (quality_ci.py) of the 16 coverage
  # partitions concurrently, each against its own PostgreSQL/Valkey pair
  # (service pair N on the ports quality_ci.slot_ports assigns slot N-1),
  # because SQL roles are cluster-wide fixtures. Packing leaves runner slots
  # for other runs (#625). Job 1 runs only partition 1, beside the
  # non-database baseline's parts (#1200, #1205). To retune, change that
  # constant or the count; the contract tests then name the matrix and
  # service pairs to update here.
  stewardship-postgresql-shard:
    needs: validate
    if: ${{ needs.validate.outputs.postgresql != 'false' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) }}
    runs-on: ubuntu-latest
    # Setup plus quality_ci.SHARD_TIMEOUT (30 minutes) and artifact upload.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3, 4, 5, 6]
    # Services start before any step, so they cannot use the daemon mirror
    # that tools/ci-docker-mirror.sh configures. Name Google's Docker Hub
    # mirror directly (#892): the digest pins the same bytes as Docker Hub's
    # postgres and valkey images in compose.yaml and runtime_topology.py.
    services:
      valkey-1:
        image: mirror.gcr.io/valkey/valkey:9.1.2@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
        ports: ["56379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
      postgres-1:
        image: mirror.gcr.io/library/postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: stewardship_tests
          POSTGRES_DB: stewardship_tests
          POSTGRES_PASSWORD: disposable-test-only
          # Keep errors/details, not multi-megabyte rejected payload statements.
          POSTGRES_INITDB_ARGS: --set=log_min_error_statement=panic
        ports: ["55432:5432"]
        options: >-
          --tmpfs /var/lib/postgresql:rw,size=2g
          --health-cmd "pg_isready -U stewardship_tests"
          --health-interval 2s --health-timeout 5s --health-retries 30
      valkey-2:
        image: mirror.gcr.io/valkey/valkey:9.1.2@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
        ports: ["56381:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
      postgres-2:
        image: mirror.gcr.io/library/postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: stewardship_tests
          POSTGRES_DB: stewardship_tests
          POSTGRES_PASSWORD: disposable-test-only
          # Keep errors/details, not multi-megabyte rejected payload statements.
          POSTGRES_INITDB_ARGS: --set=log_min_error_statement=panic
        ports: ["55433:5432"]
        options: >-
          --tmpfs /var/lib/postgresql:rw,size=2g
          --health-cmd "pg_isready -U stewardship_tests"
          --health-interval 2s --health-timeout 5s --health-retries 30
      valkey-3:
        image: mirror.gcr.io/valkey/valkey:9.1.2@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
        ports: ["56382:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
      postgres-3:
        image: mirror.gcr.io/library/postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: stewardship_tests
          POSTGRES_DB: stewardship_tests
          POSTGRES_PASSWORD: disposable-test-only
          # Keep errors/details, not multi-megabyte rejected payload statements.
          POSTGRES_INITDB_ARGS: --set=log_min_error_statement=panic
        ports: ["55434:5432"]
        options: >-
          --tmpfs /var/lib/postgresql:rw,size=2g
          --health-cmd "pg_isready -U stewardship_tests"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DJANGO_SETTINGS_MODULE: parishkit.stewardship.settings.database_test
    steps:
      - uses: actions/checkout@v4
        with:
          # The upgrade-parity test exports the previous release tag's tree
          # (test_upgrade_parity_postgresql.py), so the tags and the history
          # back to one must be present; a shallow checkout has neither.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          tools/ci-pip-install.sh -r requirements/stewardship-build.txt
          tools/ci-pip-install.sh --no-build-isolation -r requirements.txt
      - name: Download the database test selection
        if: ${{ needs.validate.outputs.database_selection == 'subset' }}
        uses: actions/download-artifact@v5
        with:
          name: stewardship-database-selection
          path: ${{ runner.temp }}/database-selection
      # Coverage gates only full runs and release evidence, so an "affected"
      # dispatch skips measurement (#858); a selection also implies it.
      - name: Measure isolated database partitions
        env:
          JOBS: ${{ inputs.jobs }}
          SELECTION: ${{ needs.validate.outputs.database_selection }}
        run: |
          set --
          if test "$JOBS" = affected; then set -- --no-coverage; fi
          if test "$SELECTION" = subset; then
            set -- "$@" --select "$RUNNER_TEMP/database-selection/database-selection.json"
          fi
          python -m parishkit.stewardship.quality_ci job --index ${{ matrix.job }} --count 16 --output "$RUNNER_TEMP/stewardship-partitions" "$@"
      # One artifact holds this job's partition-N directories; the gate
      # merges every job's artifact into one directory before combining.
      - name: Retain successful partition evidence
        if: ${{ inputs.jobs != 'affected' }}
        uses: actions/upload-artifact@v4
        with:
          name: stewardship-coverage-${{ matrix.job }}
          path: ${{ runner.temp }}/stewardship-partitions/
          if-no-files-found: error
          retention-days: 7

  # Preserve the required check name. Missing/failed/cancelled shards must make
  # this gate fail, rather than skipping it and accidentally permitting merge.
  stewardship-postgresql:
    needs: [validate, stewardship-postgresql-shard]
    if: ${{ always() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require all database shards
        id: gate
        env:
          SHARD_RESULT: ${{ needs.stewardship-postgresql-shard.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PATH_RUN: ${{ needs.validate.outputs.postgresql }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          JOBS: ${{ inputs.jobs }}
        run: |
          echo 'Full validation requires successful preflight and all database shards.'
          # A ready PR, or a dispatch that asked for affected jobs only, may
          # skip a job its changed paths cannot affect; nothing else may.
          allowed=false
          if test "$VALIDATE_RESULT" = success &&
            { { test "$EVENT" = pull_request && test "$DRAFT" = false; } ||
              { test "$EVENT" = workflow_dispatch && test "$JOBS" = affected; }; }; then
            allowed=true
          fi
          if test "$allowed" = true && test "$PATH_RUN" = false &&
            test "$SHARD_RESULT" = skipped; then
            echo 'No changed path can affect these checks; skipped intentionally.'
            echo 'intentional=true' >> "${GITHUB_OUTPUT:-/dev/null}"
            exit 0
          fi
          test "$SHARD_RESULT" = success
      # Coverage, its combined report and the test map come only from runs
      # that measured every test; an "affected" dispatch stops at the shards.
      - uses: actions/checkout@v4
        if: ${{ steps.gate.outputs.intentional != 'true' && inputs.jobs != 'affected' }}
      - uses: actions/setup-python@v5
        if: ${{ steps.gate.outputs.intentional != 'true' && inputs.jobs != 'affected' }}
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        if: ${{ steps.gate.outputs.intentional != 'true' && inputs.jobs != 'affected' }}
        run: |
          tools/ci-pip-install.sh -r requirements/stewardship-build.txt
          tools/ci-pip-install.sh --no-build-isolation -r requirements.txt
      - name: Download this run's coverage evidence
        if: ${{ steps.gate.outputs.intentional != 'true' && inputs.jobs != 'affected' }}
        uses: actions/download-artifact@v5
        with:
          pattern: stewardship-coverage-*
          path: ${{ runner.temp }}/stewardship-shards
          # Each job's artifact holds partition-N directories; merging puts
          # every partition directly under one directory for the combiner.
          merge-multiple: true
      - name: Scoped line and branch coverage
        if: ${{ steps.gate.outputs.intentional != 'true' && inputs.jobs != 'affected' }}
        run: python -m parishkit.stewardship.quality_ci combine --count 16 --input "$RUNNER_TEMP/stewardship-shards" --report "$RUNNER_TEMP/stewardship-coverage.json" --map "$RUNNER_TEMP/stewardship-test-map.json"
      - name: Retain combined coverage
        if: ${{ steps.gate.outputs.intentional != 'true' && inputs.jobs != 'affected' }}
        uses: actions/upload-artifact@v4
        with:
          name: stewardship-coverage-combined
          path: ${{ runner.temp }}/stewardship-coverage.json
          if-no-files-found: error
          retention-days: 7
      # Later "affected" dispatches select database tests from this map.
      - name: Retain the database test map
        if: ${{ steps.gate.outputs.intentional != 'true' && inputs.jobs != 'affected' }}
        uses: actions/upload-artifact@v4
        with:
          name: stewardship-test-map
          path: ${{ runner.temp }}/stewardship-test-map.json
          # combine logs a map it could not build; that never fails a run.
          if-no-files-found: warn
          retention-days: 14

  # main may rest only on a tree with a successful full CI run ("CI (jobs:
  # all)") on an identical tree, or one differing only in docs-safe paths:
  # the release gate's rule, which release_evidence.py holds for both (#158,
  # #662). Under the release-train procedure the train's run already covers
  # main's tree, so this costs about a runner-minute. It fails when the
  # deciding run did not pass (a re-run would hide a real failure; a human
  # decides) and only notes a pending one, whose own result is the signal.
  # When no run covers the tree it waits DEBOUNCE_SECONDS first: a newer
  # push in the same concurrency group cancels this job during the wait, so
  # an intermediate commit of a slow train merge never dispatches. Only when
  # main is still this commit and still uncovered does it dispatch a full
  # run on main, whose result then lands on this commit. A dispatched run
  # has a unique group, so no push cancels it.
  main-tree-evidence:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # About a minute normally; DEBOUNCE_SECONDS more before a dispatch.
    timeout-minutes: 15
    permissions:
      contents: read
      # gh workflow run, for the backfill full run.
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Candidate commits are diffed against main's head.
          fetch-depth: 0
          persist-credentials: false

      # The runner's own python3 suffices: release_evidence.py needs only the
      # standard library, git and gh, so no setup or install time is spent.
      - name: Require a full CI run of main's tree
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_COMMIT: ${{ github.sha }}
          DEBOUNCE_SECONDS: "300"
        run: |
          # Ask the release gate's rule which full run decides for main's
          # head; act on it, or return when no run covers the tree.
          decide() {
            selection="$(python3 tools/stewardship-ops/release_evidence.py select \
              --repo "${GITHUB_REPOSITORY}" --commit "${MAIN_COMMIT}")"
            read -r run status conclusion head docs run_attempt <<<"${selection:-}" || true
            case "${status:-}" in
              completed)
                if test "${conclusion}" = success; then
                  echo "Full CI run ${run} passed on ${head}, which has main's tree (${docs} docs-safe paths differ)."
                  if test "${run_attempt:-1}" -gt 1; then
                    echo "::warning::Full CI run ${run} passed on attempt ${run_attempt}: failed jobs were re-run before it passed."
                  fi
                  exit 0
                fi
                echo "::error::The newest full CI run of main's tree, run ${run} on ${head}, did not pass (${conclusion}). Fix main, or re-run that run or dispatch a full run on main if the failure was not real, then re-run this job."
                exit 1 ;;
              "" | unreadable)
                if test "${status:-}" = unreadable; then
                  echo "Full CI run ${run} is newer than any qualifying run, but its commit ${head} cannot be fetched."
                fi
                return 0 ;;
              *)
                echo "::notice::Full CI run ${run} on ${head}, which covers main's tree, is ${status}; its own result is this commit's evidence."
                exit 0 ;;
            esac
          }
          decide
          echo "No full CI run covers main's tree at ${MAIN_COMMIT}; waiting ${DEBOUNCE_SECONDS} s for a newer push before dispatching one."
          sleep "${DEBOUNCE_SECONDS}"
          # A newer push's check owns a newer head; a dispatch from here
          # would test that head, not this one.
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          if test "${current}" != "${MAIN_COMMIT}"; then
            echo "main has moved on to ${current}; the check of that push decides."
            exit 0
          fi
          # A run may have been dispatched meanwhile.
          decide
          gh workflow run ci.yml --repo "${GITHUB_REPOSITORY}" --ref main -f jobs=all
          echo "::warning::No successful full CI run covers main's tree at ${MAIN_COMMIT}, so a full CI run (jobs: all) was dispatched on main; its result is this commit's evidence."
