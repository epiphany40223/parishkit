name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # CI's full, sharded validation (lint, every PostgreSQL shard with combined
  # coverage floors, migration drift, the container, runtime and browser
  # scenarios) is the release evidence. Rerunning that suite serially here took
  # over two hours, so the release instead requires a successful full CI run
  # (dispatched by hand while main pushes run light CI; see #158) on a tree
  # identical to the tagged commit's apart from docs-safe paths (#662), then
  # packages exactly the tagged commit.
  validate-build:
    runs-on: ubuntu-latest
    # Covers waiting for a just-merged commit's CI run to finish.
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          tools/ci-pip-install.sh -r requirements/stewardship-build.txt
          tools/ci-pip-install.sh --no-build-isolation -r requirements.txt

      - name: Validate release tag
        id: tag
        run: |
          # actions/checkout re-fetches the tag as "<commit sha>:refs/tags/<tag>",
          # which replaces the annotated tag with a lightweight one
          # (actions/checkout#290). Fetch the real tag object again so the
          # annotated-tag check sees what was pushed.
          git fetch --no-tags --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "${GITHUB_REF_NAME}")" = tag
          release_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          git merge-base --is-ancestor "${release_commit}" origin/main
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${version}" = "${GITHUB_REF_NAME}"
          echo "commit=${release_commit}" >> "$GITHUB_OUTPUT"

      - name: Require a successful full CI run of the release tree
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          # Pushes to main run only light validation (issue #158), so a
          # release needs a dispatched full CI run (named exactly "CI (jobs:
          # all)"; a jobs=affected dispatch may have skipped job groups,
          # #626) on a commit whose tree is identical to the tagged commit's
          # or differs only in docs-safe paths (#662): a nightly train head
          # merged into main in order has main's tree under another SHA.
          # tools/stewardship-ops/release_evidence.py holds the rule and its
          # closed allowlist and names the deciding run; this step enforces
          # it on every tag push, whoever pushed the tag. Poll while that run
          # is queued or in progress; refuse a failed run, no run, or a newer
          # full run whose commit this clone cannot fetch (keep a train
          # branch until this release passes). The script retries gh, limits
          # each git and gh call, and exits 3 past a limit.
          for attempt in $(seq 1 80); do
            selection="$(python tools/stewardship-ops/release_evidence.py select \
              --repo "${GITHUB_REPOSITORY}" --commit "${RELEASE_COMMIT}")"
            read -r run status conclusion head docs <<<"${selection:-}" || true
            case "${status:-}" in
              unreadable)
                echo "::error::Full CI run ${run} is newer than any qualifying run, but its commit ${head} cannot be fetched (see the log above); restore the branch that holds it, or dispatch a full run on main and re-tag."
                exit 1 ;;
              completed)
                if test "${conclusion}" = success; then
                  echo "Full CI run ${run} passed on ${head} (${docs} docs-safe paths differ from ${RELEASE_COMMIT})."
                  echo "run=${run}" >> "$GITHUB_OUTPUT"
                  echo "commit=${head}" >> "$GITHUB_OUTPUT"
                  echo "docs=${docs}" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                echo "::error::Full CI run ${run} on ${head}, the release evidence for ${RELEASE_COMMIT}, did not pass (${conclusion}); fix main and tag a passing commit."
                exit 1 ;;
              "")
                # A just-dispatched run can take a moment to appear.
                if test "${attempt}" -ge 5; then
                  echo "::error::No full CI run exists on ${RELEASE_COMMIT} or on a commit whose tree differs from it only in docs-safe paths; run gh workflow run ci.yml --ref main (all jobs) while it is main's head, then re-run this release."
                  exit 1
                fi ;;
              *)
                echo "Full CI run ${run} on ${head}: ${status}; waiting." ;;
            esac
            sleep 60
          done
          echo "::error::Timed out waiting for full CI evidence for ${RELEASE_COMMIT}."
          exit 1

      # Documentation is a test input (Markdown lint, traceability and the
      # contract tests that read guides and specs). When the evidence run's
      # tree differs from the tagged one, those checks never ran on the
      # tagged documentation, so run them here, fast and without a database.
      - name: Check the documentation the evidence run did not see
        id: docs
        if: ${{ steps.evidence.outputs.docs != '0' }}
        run: |
          # release_evidence.py lists the tests, so release.sh runs the same.
          docs_tests="$(python tools/stewardship-ops/release_evidence.py docs-tests | tr '\n' ' ')"
          python -m pymarkdown --config .pymarkdown.json scan $(git ls-files '*.md')
          python -m pytest ${docs_tests} --ds=parishkit.stewardship.settings.test -p no:cacheprovider -q
          echo "checks=pymarkdown on every tracked Markdown file and pytest ${docs_tests}" >> "$GITHUB_OUTPUT"

      - name: Build artifacts
        run: python -m build --no-isolation

      - name: Generate release notes
        env:
          EVIDENCE_RUN: ${{ steps.evidence.outputs.run }}
          EVIDENCE_COMMIT: ${{ steps.evidence.outputs.commit }}
          EVIDENCE_DOCS: ${{ steps.evidence.outputs.docs }}
          DOCS_CHECKS: ${{ steps.docs.outputs.checks }}
        run: |
          if test -f RELEASE_NOTES.md; then
            cp RELEASE_NOTES.md release-notes.md
          else
            python tools/prepare-release.py \
              --version "${GITHUB_REF_NAME#v}" \
              --write-notes release-notes.md
          fi
          # Name the evidence, as the release log does (#662).
          printf '\nRelease evidence: full CI run %s/%s/actions/runs/%s on commit `%s` (%s docs-safe paths differ from the tagged tree).\n' \
            "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${EVIDENCE_RUN}" \
            "${EVIDENCE_COMMIT}" "${EVIDENCE_DOCS}" >> release-notes.md
          if test -n "${DOCS_CHECKS}"; then
            printf 'Documentation checks on the tagged tree: %s.\n' "${DOCS_CHECKS}" >> release-notes.md
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # The production runtime admits only ghcr.io/<owner>/<repository>/stewardship
  # by digest, and this is the only job that publishes that image. It runs
  # after the tagged commit passed the full validation above, with the
  # package scope alone, so no image leaves the workflow unvalidated. After
  # the push it runs the pushed digest (#392 L4) and attests its build
  # provenance (#392 M2) before the digest becomes release evidence.
  publish-image:
    needs: validate-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Only this job signs: the OIDC token proves which workflow, ref and
      # commit built the image, and the attestation is stored with GitHub.
      id-token: write
      attestations: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Name the image
        id: name
        run: |
          # GHCR requires a lowercase repository path, and so does the
          # runtime's approved image pattern. Release tags are annotated, so
          # GITHUB_SHA may name the tag object; the commit tag must name the
          # commit the tag points to, resolved as validate-build does.
          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repository}/stewardship" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-list -n 1 "${GITHUB_REF_NAME}")" >> "$GITHUB_OUTPUT"

      - name: Pull Docker Hub images through a mirror
        # Anonymous Docker Hub pulls hit its rate limit (#892). The
        # Dockerfile pins its base by digest, so the image is unchanged.
        run: tools/ci-docker-mirror.sh

      - name: Build the application image
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          VERSION: ${{ steps.name.outputs.version }}
          COMMIT: ${{ steps.name.outputs.commit }}
        run: |
          docker build \
            --file deploy/stewardship/Dockerfile \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:${COMMIT}" \
            .

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "${GH_TOKEN}" \
            | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Push the image and record its digest
        id: push
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          VERSION: ${{ steps.name.outputs.version }}
          COMMIT: ${{ steps.name.outputs.commit }}
        run: |
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:${COMMIT}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${VERSION}")"
          # release.sh reads the digest from this exact log line.
          printf '\nApplication image: `%s`\n' "${digest}" | tee image-digest.txt
          echo "reference=${digest}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      # A rebuild at release time is not the image CI tested (#392 L4), so
      # run the pushed digest, pulled back from GHCR as a host pulls it, the
      # way the runbook runs offline commands: no network, read-only, no
      # capabilities. collect-static configures Django and imports every
      # app, so a missing module or broken dependency fails here; the
      # bundled pg_dump must be the server's major version (backups use it).
      # A failure stops the job before the attestation and the digest
      # artifact, so no GitHub Release names the image.
      - name: Smoke-test the pushed image
        timeout-minutes: 5
        env:
          REFERENCE: ${{ steps.push.outputs.reference }}
          VERSION: ${{ steps.name.outputs.version }}
        run: |
          docker pull --quiet "${REFERENCE}"
          isolated=(docker run --rm --init --network none --user 10001:10001
            --read-only --cap-drop ALL --security-opt no-new-privileges:true
            --tmpfs "/tmp:rw,nosuid,nodev,noexec,mode=1777")
          reported="$("${isolated[@]}" "${REFERENCE}" --version)"
          echo "${reported}"
          test "${reported}" = "pk-stewardship ${VERSION}"
          collected="$("${isolated[@]}" \
            --tmpfs "/smoke-static:rw,nosuid,nodev,noexec,mode=0700,uid=10001,gid=10001" \
            "${REFERENCE}" collect-static --destination /smoke-static)"
          echo "${collected}"
          test "${collected}" = '{"static_assets_collected": true}'
          client="$("${isolated[@]}" --entrypoint pg_dump "${REFERENCE}" --version)"
          echo "${client}"
          case "${client}" in
            "pg_dump (PostgreSQL) 18."*) ;;
            *) echo "::error::The image's pg_dump is not PostgreSQL 18: ${client}"; exit 1 ;;
          esac

      # Signed build provenance for the pushed digest (#392 M2), checked by
      # release.sh and the upgrade runbook with gh attestation verify. It is
      # kept in GitHub's attestation store, not pushed to GHCR, so the run
      # log names no second ...@sha256: reference beside the image's.
      - name: Attest the image's build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false

      - name: Upload the image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt
          if-no-files-found: error

  publish:
    needs: [validate-build, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Download the image digest
        uses: actions/download-artifact@v4
        with:
          name: image-digest

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so gh cannot infer the repository from
          # a git remote; name it explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          # The release names the exact immutable reference the deployment
          # configuration must carry; operators copy it, never a tag.
          cat image-digest.txt >> release-notes.md
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
