name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate-build:
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:9.1.2@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
        ports: ["56379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
      postgres:
        image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: stewardship_tests
          POSTGRES_DB: stewardship_tests
          POSTGRES_PASSWORD: disposable-test-only
          # Keep errors/details, not multi-megabyte rejected payload statements.
          POSTGRES_INITDB_ARGS: --set=log_min_error_statement=panic
        ports: ["55432:5432"]
        options: >-
          --tmpfs /var/lib/postgresql:rw,size=2g
          --health-cmd "pg_isready -U stewardship_tests"
          --health-interval 2s --health-timeout 5s --health-retries 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements/stewardship-build.txt
          python -m pip install --no-build-isolation -r requirements.txt

      - name: Validate release tag
        run: |
          test "$(git cat-file -t "${GITHUB_REF_NAME}")" = tag
          release_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          git merge-base --is-ancestor "${release_commit}" origin/main
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Markdown lint
        run: python -m pymarkdown --config .pymarkdown.json scan $(git ls-files '*.md')

      - name: Scoped line and branch coverage
        run: python -m parishkit.stewardship.quality --postgresql --report "$RUNNER_TEMP/stewardship-coverage.json"

      - name: Migration drift
        env:
          DJANGO_SETTINGS_MODULE: parishkit.stewardship.settings.test
        run: python -m django makemigrations --check --dry-run

      - name: Build artifacts
        run: python -m build --no-isolation

      - name: Verify application image mount isolation
        env:
          PARISHKIT_RUN_ISOLATION_TESTS: "1"
        run: |
          docker compose -f deploy/stewardship/compose.yaml -f deploy/stewardship/compose.development.yaml build web
          python -m pytest tests/stewardship/test_container_isolation.py --require-no-skips -q

      - name: Validate operational runtime and provisioning
        env:
          PARISHKIT_RUN_RUNTIME_TESTS: "1"
        run: python -m pytest tests/stewardship/test_operational_compose.py tests/stewardship/test_database_provisioning_container.py tests/stewardship/test_runtime_provisioning_container.py tests/stewardship/test_runtime_ingress_container.py --require-no-skips -q

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/stewardship/browser/package-lock.json

      - name: Browser component release validation
        env:
          PARISHKIT_RUN_BROWSER_TESTS: "1"
        run: |
          python -m pip install -r requirements/stewardship-browser.txt
          npm ci --ignore-scripts --prefix tests/stewardship/browser
          python -m playwright install --with-deps chromium firefox webkit
          python -m pytest tests/stewardship/browser --require-no-skips -q

      - name: Generate release notes
        run: |
          if test -f RELEASE_NOTES.md; then
            cp RELEASE_NOTES.md release-notes.md
          else
            python tools/prepare-release.py \
              --version "${GITHUB_REF_NAME#v}" \
              --write-notes release-notes.md
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # The production runtime admits only ghcr.io/<owner>/<repository>/parishkit
  # by digest, and this is the only job that publishes that image. It runs
  # after the tagged commit passed the full validation above, with the
  # package scope alone, so no image leaves the workflow unvalidated.
  publish-image:
    needs: validate-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Name the image
        id: name
        run: |
          # GHCR requires a lowercase repository path, and so does the
          # runtime's approved image pattern. Release tags are annotated, so
          # GITHUB_SHA may name the tag object; the commit tag must name the
          # commit the tag points to, resolved as validate-build does.
          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repository}/parishkit" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-list -n 1 "${GITHUB_REF_NAME}")" >> "$GITHUB_OUTPUT"

      - name: Build the application image
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          VERSION: ${{ steps.name.outputs.version }}
          COMMIT: ${{ steps.name.outputs.commit }}
        run: |
          docker build \
            --file deploy/stewardship/Dockerfile \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:${COMMIT}" \
            .

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "${GH_TOKEN}" \
            | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Push the image and record its digest
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          VERSION: ${{ steps.name.outputs.version }}
          COMMIT: ${{ steps.name.outputs.commit }}
        run: |
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:${COMMIT}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${VERSION}")"
          printf '\nApplication image: `%s`\n' "${digest}" | tee image-digest.txt

      - name: Upload the image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt
          if-no-files-found: error

  publish:
    needs: [validate-build, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Download the image digest
        uses: actions/download-artifact@v4
        with:
          name: image-digest

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release names the exact immutable reference the deployment
          # configuration must carry; operators copy it, never a tag.
          cat image-digest.txt >> release-notes.md
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
