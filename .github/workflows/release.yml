name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Every commit on main already passed CI's full, sharded validation (lint,
  # every PostgreSQL shard with combined coverage floors, migration drift, the
  # container, runtime and browser scenarios). Rerunning that suite serially
  # here took over two hours, so the release instead requires that commit's
  # successful main CI run, then packages exactly that commit.
  validate-build:
    runs-on: ubuntu-latest
    # Covers waiting for a just-merged commit's CI run to finish.
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements/stewardship-build.txt
          python -m pip install --no-build-isolation -r requirements.txt

      - name: Validate release tag
        id: tag
        run: |
          # actions/checkout re-fetches the tag as "<commit sha>:refs/tags/<tag>",
          # which replaces the annotated tag with a lightweight one
          # (actions/checkout#290). Fetch the real tag object again so the
          # annotated-tag check sees what was pushed.
          git fetch --no-tags --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "${GITHUB_REF_NAME}")" = tag
          release_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          git merge-base --is-ancestor "${release_commit}" origin/main
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${version}" = "${GITHUB_REF_NAME}"
          echo "commit=${release_commit}" >> "$GITHUB_OUTPUT"

      - name: Require the release commit's successful main CI run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          # Only a push to main runs CI's full suite on exactly this commit; a
          # pull request run tested a different (pre-merge) commit. Poll while
          # that run is queued or in progress. Refuse a failed run, and a
          # commit main CI never ran on (for example one inside a merged
          # branch): tag the merge commit on main instead.
          for attempt in $(seq 1 80); do
            state="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml \
              --event push --branch main --commit "${RELEASE_COMMIT}" --limit 1 \
              --json status,conclusion --jq '.[] | "\(.status) \(.conclusion)"')"
            case "${state}" in
              "completed success")
                echo "Main CI passed for ${RELEASE_COMMIT}."
                exit 0 ;;
              completed*)
                echo "::error::Main CI for ${RELEASE_COMMIT} did not pass (${state}); fix main and tag a passing commit."
                exit 1 ;;
              "")
                # A just-merged commit's run can take a moment to appear.
                if test "${attempt}" -ge 5; then
                  echo "::error::No main CI run exists for ${RELEASE_COMMIT}; tag a commit that main CI ran on."
                  exit 1
                fi ;;
              *)
                echo "Main CI for ${RELEASE_COMMIT}: ${state}; waiting." ;;
            esac
            sleep 60
          done
          echo "::error::Timed out waiting for main CI on ${RELEASE_COMMIT}."
          exit 1

      - name: Build artifacts
        run: python -m build --no-isolation

      - name: Generate release notes
        run: |
          if test -f RELEASE_NOTES.md; then
            cp RELEASE_NOTES.md release-notes.md
          else
            python tools/prepare-release.py \
              --version "${GITHUB_REF_NAME#v}" \
              --write-notes release-notes.md
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # The production runtime admits only ghcr.io/<owner>/<repository>/parishkit
  # by digest, and this is the only job that publishes that image. It runs
  # after the tagged commit passed the full validation above, with the
  # package scope alone, so no image leaves the workflow unvalidated.
  publish-image:
    needs: validate-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Name the image
        id: name
        run: |
          # GHCR requires a lowercase repository path, and so does the
          # runtime's approved image pattern. Release tags are annotated, so
          # GITHUB_SHA may name the tag object; the commit tag must name the
          # commit the tag points to, resolved as validate-build does.
          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repository}/parishkit" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-list -n 1 "${GITHUB_REF_NAME}")" >> "$GITHUB_OUTPUT"

      - name: Build the application image
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          VERSION: ${{ steps.name.outputs.version }}
          COMMIT: ${{ steps.name.outputs.commit }}
        run: |
          docker build \
            --file deploy/stewardship/Dockerfile \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:${COMMIT}" \
            .

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "${GH_TOKEN}" \
            | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Push the image and record its digest
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          VERSION: ${{ steps.name.outputs.version }}
          COMMIT: ${{ steps.name.outputs.commit }}
        run: |
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:${COMMIT}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${VERSION}")"
          printf '\nApplication image: `%s`\n' "${digest}" | tee image-digest.txt

      - name: Upload the image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt
          if-no-files-found: error

  publish:
    needs: [validate-build, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Download the image digest
        uses: actions/download-artifact@v4
        with:
          name: image-digest

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release names the exact immutable reference the deployment
          # configuration must carry; operators copy it, never a tag.
          cat image-digest.txt >> release-notes.md
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
