# Lima instance for the Stewardship local laptop environment (#476), created
# by `tools/stewardship-local.sh vm create`. A production-like Linux host on
# the laptop: Ubuntu 24.04 arm64 on Apple Virtualization.framework with Docker
# Engine, reached by ssh, forwarding only the site (8443) and the mail catcher
# UI (8025) to the laptop's loopback. The settings are those of the
# local-environment specification's "Host virtual machine" section.
vmType: vz
arch: aarch64
cpus: 4
memory: 5GiB
disk: 40GiB
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: aarch64
# No host directory is shared (this also drops Lima's default read-only home
# mount): the VM keeps its own Linux filesystem, so file ownership behaves as
# on the production host. Source reaches the VM only as a packed archive.
mounts: []
# Docker Engine, not Lima's bundled containerd.
containerd:
  system: false
  user: false
portForwards:
  - guestPort: 8443
    hostIP: 127.0.0.1
    hostPort: 8443
  - guestPort: 8025
    hostIP: 127.0.0.1
    hostPort: 8025
  # Forward nothing else; Lima's own ssh forward is the only other listener.
  - guestPortRange: [1, 65535]
    ignore: true
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      if ! command -v docker >/dev/null; then
        # Docker Engine and the Compose plugin from Docker's apt repository.
        curl -fsSL https://get.docker.com | sh
      fi
      apt-get install -y jq rsync
      mkdir -p /opt/parishkit
