# Enumerate files in mixed-use scripts/tools directories to exclude local
# operational output. Dedicated spec/plan/deployment fixture trees are mounted
# as directories. Build inputs use separate reference paths, never overlays.
x-test-bind: &test-bind
  type: bind
  read_only: true
  bind:
    create_host_path: false

x-live-source: &live-source
  type: bind
  source: ../../src
  target: /app/src
  read_only: true
  bind:
    create_host_path: false

services:
  web:
    build:
      context: ../..
      dockerfile: deploy/stewardship/Dockerfile
    command:
      - service
      - --profile
      - development
      - --service-role
      - web
      - --bind-all-interfaces
    volumes: [*live-source]
    ports: ["127.0.0.1:${STEWARDSHIP_HTTP_PORT:-8000}:8000"]
    networks: [backend, development]

  tests:
    extends:
      file: compose.yaml
      service: web
    profiles: [test]
    entrypoint: [python, -m, pytest]
    command: [-p, no:cacheprovider]
    healthcheck:
      disable: true
    volumes:
      - *live-source
      - <<: *test-bind
        source: ../../README.md
        target: /app/checkout-build-inputs/README.md
      - <<: *test-bind
        source: ../../pyproject.toml
        target: /app/checkout-build-inputs/pyproject.toml
      - <<: *test-bind
        source: ../../requirements/stewardship.txt
        target: /app/checkout-build-inputs/requirements/stewardship.txt
      - <<: *test-bind
        source: ../../requirements/stewardship-build.txt
        target: /app/checkout-build-inputs/requirements/stewardship-build.txt
      - <<: *test-bind
        source: ../../.dockerignore
        target: /app/checkout-build-inputs/.dockerignore
      - <<: *test-bind
        source: Dockerfile
        target: /app/checkout-build-inputs/deploy/stewardship/Dockerfile
      - <<: *test-bind
        source: Dockerfile.dockerignore
        target: /app/checkout-build-inputs/deploy/stewardship/Dockerfile.dockerignore
      - <<: *test-bind
        source: ../../tests
        target: /app/tests
      - <<: *test-bind
        source: ../../.dockerignore
        target: /app/.dockerignore
      - <<: *test-bind
        source: ../../scripts/pk-stewardship/pk-stewardship.py
        target: /app/scripts/pk-stewardship/pk-stewardship.py
      - <<: *test-bind
        source: ../../scripts/pk-stewardship/README.md
        target: /app/scripts/pk-stewardship/README.md
      - <<: *test-bind
        source: ../../scripts/pk-stewardship/example-config.yaml
        target: /app/scripts/pk-stewardship/example-config.yaml
      - <<: *test-bind
        source: ../../scripts/pk-cron-runner/pk-cron-runner.py
        target: /app/scripts/pk-cron-runner/pk-cron-runner.py
      - <<: *test-bind
